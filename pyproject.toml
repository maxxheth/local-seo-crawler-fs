[project]
name = "local-seo-crawler-fs"
version = "0.2.0"
description = "High-throughput concurrent multi-source Local SEO scraper"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "scrapling>=0.5",
    "selectolax>=1.0.2",
    "beautifulsoup4>=4.15.0",
    "pydantic>=2.14.0",
    "rich>=14.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "redis>=5.0.0",
    "zstandard>=0.23.0",
    "pytest>=8.0.0",
    "openpyxl>=3.1.5",
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.0",
    "requests>=2.32.0",
]

[project.scripts]
local-seo-crawler = "src.main:main"
crawler-google-auth = "src.google_auth:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
