services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: local-seo-crawler-flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=America/Chicago
    ports:
      - "${FLARESOLVERR_PORT:-8193}:8193"
    restart: unless-stopped

  crawler:
    build: .
    container_name: local-seo-crawler
    depends_on:
      - flaresolverr
    environment:
      - FLARESOLVERR_URL=http://flaresolverr:8193
      - PROXY_FILE=proxies.txt
      - OUTPUT_DIR=artifacts
    volumes:
      - ./:/app
    command: ["local-seo-crawler", "--help"]
